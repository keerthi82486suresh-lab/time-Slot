<!DOCTYPE html>
<html>
<head>
    <title>Class Timetable</title>
</head>
<body>

    <h1>Class Timetable</h1>

    {% if slots %}

    <table border="1">
        <tr>
            <th>Day</th>
            <th>Time Slot</th>
            <th>Subject</th>
            <th>Faculty Name</th>
        </tr>

        {% for slot in slots %}
        <tr>
            <td>{{ slot.day }}</td>
            <td>{{ slot.start_time }} - {{ slot.end_time }}</td>
            <td>{{ slot.subject }}</td>
            <td>{{ slot.faculty_name }}</td>
        </tr>
        {% endfor %}

    </table>

    {% else %}

    <p>No timetable records are available.</p>

    {% endif %}

</body>
</html>
